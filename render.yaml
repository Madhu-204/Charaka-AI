# Charaka AI — completely free deployment blueprint (Render)
#
# Hugging Face Spaces stopped allowing free Docker/Gradio Spaces (PRO required
# since mid-2026), so the free path is Render: the same Dockerfile.deploy image
# runs as a Free web service (0.1 CPU / 512 MB RAM, no credit card).
#
# To deploy (one click):
#   1. dashboard.render.com -> New + -> Blueprint -> select this GitHub repo
#   2. Render reads this file, builds Dockerfile.deploy and creates the service
#   3. Add the GROQ_API_KEY secret (and optionally CHARAKA_API_KEY) on the
#      service's "Environment" tab
#   4. Set the repo variable CHARAKA_APP_URL = https://<name>.onrender.com
#      so .github/workflows/heartbeat.yml keeps the free instance warm.
#
# Notes:
#   - Free instances spin down after 15 min idle and take ~1 min to wake.
#   - The container listens on ${PORT} (Render sets 10000).
#   - Writes to the filesystem (feedback log, traces, uploaded docs) are
#     ephemeral and reset on redeploy/spin-down — expected on the free plan.
services:
  - type: web
    name: charaka-ai
    runtime: docker
    dockerfilePath: ./Dockerfile.deploy
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false
      # Sign-in is OFF: the SPA goes straight to the chat dashboard and never
      # renders the login/register screen. Safe only because nothing private is
      # per-user -- every visitor is the single "shared" owner, so conversations
      # and uploaded documents are visible to (and deletable by) anyone who
      # reaches the URL. Set this back to "1" as soon as accounts are finished.
      - key: CHARAKA_AUTH_REQUIRED
        value: "0"
      # Shared key for /ask, conversations, documents and feedback.
      - key: CHARAKA_API_KEY
        sync: false
      # Separate key for /eval, /traces and /stats. Set this to a different
      # value: leaving it unset leaves those routes open to anyone.
      - key: CHARAKA_ADMIN_KEY
        sync: false
      - key: CHARAKA_RATE_LIMIT
        value: "30"
      - key: CHARAKA_RATE_BURST
        value: "60"
      # 2 concurrent LLM calls keeps us inside Groq's 8K TPM free tier.
      - key: CHARAKA_LLM_CONCURRENCY
        value: "2"
      - key: CHARAKA_LLM_QUEUE_TIMEOUT
        value: "45"
      # Lock the API down to your own frontend origin once it is deployed.
      - key: CHARAKA_ALLOWED_ORIGINS
        sync: false