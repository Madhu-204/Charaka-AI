# Single-origin free-deployment image — same one the free Render deploy uses.
# `Dockerfile.deploy` builds the frontend SPA and serves it + the API from one
# FastAPI process on :7860 (no CORS, no nginx). Perfect for testing exactly
# what runs free in production.
services:
  charaka-ai:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    image: charaka-ai:latest
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      CHARAKA_CACHE_SIZE: "64"
      CHARAKA_CACHE_TTL: "3600"
      CHARAKA_RATE_LIMIT: "30"
      CHARAKA_RATE_BURST: "60"
    ports:
      - "7860:7860"
    restart: unless-stopped